<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORMA / 原创作品集组合</title><link rel="stylesheet" href="../../elements/scenes.css?v=01000ffa17"><link rel="stylesheet" href="../recipes.css?v=08e8522459"><script src="../../elements/scene-lifecycle.js?v=45554bc73e" defer></script><link rel="stylesheet" href="../../elements/compact.css?v=71075f8b47"><script src="../../elements/compact.js?v=2f8f5ff4f8" defer></script><link rel="stylesheet" href="../../catalog/pointer.css?v=d92459312e"><script src="../../catalog/pointer.js?v=6a5aca2cbe" defer></script><link rel="stylesheet" href="../../catalog/site-fonts.css?v=8d6074b2b9"></head><body data-scene="portfolio"><main><article class="designed-scene portfolio"><header class="scene-bar"><strong>forma.</strong><span>INDEPENDENT DESIGN PRACTICE</span></header><section class="portfolio-title"><h1>Good ideas.<br>Made tangible.</h1><p>品牌、物件与数字体验。<br>让作品，成为想法的一种表达。</p></section><div class="portfolio-tools"><label for="filter">看哪一种创作<select id="filter"><option value="全部">全部作品</option><option value="版式">版式与空间</option><option value="交互">数字与交互</option></select></label><output id="count" role="status">4 个作品</output></div><section class="work-grid" aria-label="虚构作品集"><article class="work" data-category="版式"><button type="button" data-description="独立原创的虚构项目；仅演示作品集详情，不包含实际客户交付。" data-title="Between Spaces / 空间里的留白" aria-label="查看空间里的留白"><div class="work-art"><img src="../../elements/visual/visual-0005/assets/quiet-coast.jpg" width="1536" height="1024" alt="原创生成的空间里的留白项目视觉"></div><div class="work-label"><h2>Between Spaces</h2><span>版式</span></div><p>一面墙、一束光，以及让内容呼吸的空间。</p></button></article><article class="work" data-category="交互"><button type="button" data-description="独立原创的虚构项目；仅演示作品集详情，不包含实际客户交付。" data-title="Olive Objects / 物件的数字叙事" aria-label="查看物件的数字叙事"><div class="work-art"><img src="../../elements/assets/olive-chair.jpg" width="1536" height="1024" alt="原创生成的物件的数字叙事项目视觉"></div><div class="work-label"><h2>Olive Objects</h2><span>交互</span></div><p>让一件日常物品，拥有清楚而克制的展示体验。</p></button></article><article class="work" data-category="版式"><button type="button" data-description="独立原创的虚构项目；仅演示作品集详情，不包含实际客户交付。" data-title="Quiet Rituals / 日常里的小仪式" aria-label="查看日常里的小仪式"><div class="work-art"><img src="../../elements/assets/ceramic-study.jpg" width="1536" height="1024" alt="原创生成的日常里的小仪式项目视觉"></div><div class="work-label"><h2>Quiet Rituals</h2><span>版式</span></div><p>用色彩、照片与文字，组织一段缓慢的阅读。</p></button></article><article class="work" data-category="交互"><button type="button" data-description="独立原创的虚构项目；仅演示作品集详情，不包含实际客户交付。" data-title="A Little Closer / 让想法彼此靠近" aria-label="查看让想法彼此靠近"><div class="work-art"><div class="portfolio-type">Make space<br>for ideas.</div></div><div class="work-label"><h2>A Little Closer</h2><span>交互</span></div><p>从一个入口，到一个能够被理解的操作结果。</p></button></article></section><footer class="portfolio-footer"><p>Make something<br>worth keeping.</p><span>虚构作品集 · 原创组合实践 · 影像为 AI 生成</span></footer></article><dialog id="dialog"><h2 id="detail-title">作品详情</h2><p id="detail-description">这是原创作品集交互演示。筛选、查看详情和焦点返回在当前页面运行，没有真实客户项目或业务提交。</p><form method="dialog"><button autofocus>关闭详情</button></form></dialog></main><script>const cards=[...document.querySelectorAll('.work')],reduced=matchMedia('(prefers-reduced-motion: reduce)'),dialog=document.getElementById('dialog');let trigger=null;document.getElementById('filter').addEventListener('change',e=>{let i=0;for(const card of cards){card.classList.remove('enter');card.hidden=e.target.value!=='全部'&&card.dataset.category!==e.target.value;if(!card.hidden){card.style.setProperty('--i',i++);if(!reduced.matches){void card.offsetWidth;card.classList.add('enter');}}}document.getElementById('count').textContent=i+' 个作品';});for(const button of document.querySelectorAll('[data-title]'))button.addEventListener('click',()=>{trigger=button;document.getElementById('detail-title').textContent=button.dataset.title;document.getElementById('detail-description').textContent=button.dataset.description;dialog.showModal();});dialog.addEventListener('close',()=>trigger?.focus());
</script></body></html>
