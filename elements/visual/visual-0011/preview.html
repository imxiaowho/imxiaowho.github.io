<body data-scene="specimen" data-studio="visual-0011"><main><section class="designed-scene specimen"><header class="scene-bar"><strong>LETTERS</strong><span>THE BILINGUAL TYPE CLUB</span></header><article id="specimen" class="type-specimen"><div class="specimen-top"><span class="specimen-letter" aria-hidden="true">Ag<span>字</span></span><div><h1>设计，让阅读<br>自然发生。</h1><p>Type makes a difference.</p></div></div><div class="specimen-bottom"><p>同样的内容，也有不同的声音。字体的形状、重量、比例与间距，会改变一句话的语气。Read the same paragraph at the size you actually use.</p><span>形 / SHAPE<br>韵 / RHYTHM<br>读 / READ</span></div></article><section class="title-overflow"><h2>长标题，也要有出口。</h2><p id="long">2026 前端创作参考：从字体编排、视觉层级，到可访问状态与动效实践的一次完整观察</p><button id="expand" type="button" aria-expanded="false" aria-controls="long">展开完整标题</button></section><footer class="scene-colophon"><span>LETTERS / TYPE CLUB</span><span>原创虚构场景</span></footer></section><section class="scene-inspector" aria-label="调整这个样本"><label for="font">字体声音<select id="font"><option value="sans">思源黑体 / 无衬线</option><option value="serif">思源宋体 / 衬线对照</option></select></label></section></main><script>
'use strict';
document.getElementById('font').addEventListener('change',e=>document.getElementById('specimen').classList.toggle('serif',e.target.value==='serif'));const expand=document.getElementById('expand'),long=document.getElementById('long');expand.addEventListener('click',()=>{const open=expand.getAttribute('aria-expanded')!=='true';expand.setAttribute('aria-expanded',String(open));long.classList.toggle('expanded',open);expand.textContent=open?'收起为单行':'展开完整标题';});

</script></body></html>
