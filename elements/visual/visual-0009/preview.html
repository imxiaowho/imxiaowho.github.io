<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHELTER / STORIES · 给画面保留主体</title><link rel="stylesheet" href="../../scenes.css?v=01000ffa17"><script src="../../scene-lifecycle.js?v=45554bc73e" defer></script><link rel="stylesheet" href="../../compact.css?v=71075f8b47"><script src="../../compact.js?v=2f8f5ff4f8" defer></script><link rel="stylesheet" href="../../../catalog/pointer.css?v=d92459312e"><script src="../../../catalog/pointer.js?v=6a5aca2cbe" defer></script><link rel="stylesheet" href="../../../catalog/site-fonts.css?v=8d6074b2b9"></head>
<body data-scene="focal" data-studio="visual-0009"><main><section class="designed-scene focal"><header class="scene-bar"><strong>SHELTER</strong><span>SPACES WORTH STAYING IN</span></header><div class="focus-layout"><div class="focus-copy"><h1>画幅变了，<br>主角还在。</h1><p>一面墙、一扇门、一棵树。<br>取舍之间，保留你真正想讲的故事。</p><div class="focus-positions"><button type="button" data-focus="15">看向墙面</button><button type="button" data-focus="65">留下橄榄树</button><button type="button" data-focus="100">望向海面</button></div><p class="scene-meta">GENERATED COAST / COMPOSITION STUDY</p></div><figure class="focal-figure"><img id="sample" class="focal-photo" src="../../visual/visual-0005/assets/quiet-coast.jpg" width="1536" height="1024" alt="原创生成的海岸建筑：观察门洞、橄榄树与海面在裁切中的位置"><figcaption>同一幅影像，不同的叙事重心。</figcaption></figure></div><footer class="scene-colophon"><span>SHELTER / STORIES</span><span>虚构场景 · AI 影像</span></footer></section><section class="scene-inspector" aria-label="调整这个样本"><label class="range-control" for="position">焦点位置<output id="value">65%</output><input id="position" type="range" min="0" max="100" value="65"></label><label for="shape">画面形状<select id="shape"><option value="4 / 5">竖版 4:5</option><option value="1 / 1">方形 1:1</option><option value="16 / 9">横幅 16:9</option></select></label></section></main><script>document.getElementById('position').addEventListener('input',e=>{document.getElementById('sample').style.objectPosition=e.target.value+'% 50%';document.getElementById('value').textContent=e.target.value+'%';});document.getElementById('shape').addEventListener('change',e=>{document.getElementById('sample').style.aspectRatio=e.target.value;});

document.querySelectorAll('[data-focus]').forEach(b=>b.addEventListener('click',()=>{const input=document.getElementById('position');input.value=b.dataset.focus;input.dispatchEvent(new Event('input',{bubbles:true}));}));</script></body></html>
