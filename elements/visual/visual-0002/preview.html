<!doctype html>
<html data-site-page="example" lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIELD NOTES · 字与行之间</title><link rel="stylesheet" href="../../scenes.css?v=01000ffa17"><script src="../../scene-lifecycle.js?v=45554bc73e" defer></script><link rel="stylesheet" href="../../compact.css?v=71075f8b47"><script src="../../compact.js?v=2f8f5ff4f8" defer></script><link rel="stylesheet" href="../../../catalog/pointer.css?v=d92459312e"><script src="../../../catalog/pointer.js?v=6a5aca2cbe" defer></script><link rel="stylesheet" href="../../../catalog/site-fonts.css?v=8d6074b2b9">  <script src="/assets/site-paper/theme.js?v=1fef9ef7e7"></script>
  <link rel="stylesheet" href="/assets/site-paper/theme.css?v=1414eeb17a">
</head>
<body data-scene="type-reading" data-studio="visual-0002"><main><section class="designed-scene type-reading"><header class="scene-bar"><strong>FIELD NOTES</strong><span>ON TYPE & EVERYDAY LIFE</span></header><div class="reading-layout"><aside><span class="large-letter" aria-hidden="true">Aa</span><p>字与行之间，<br>藏着阅读的节奏。</p></aside><article><h1>写给愿意<br>慢下来的人。</h1><div id="sample" class="reading-prose"><p>设计有时始于一次停顿。光线掠过桌面，纸张翻过一页，文字在恰当的位置结束。我们不是在填满一块屏幕，而是在安排一次阅读。</p><p>字的大小决定声音的轻重，行与行的距离决定语气。把它们放在一起看，才能知道一段内容是急着被看完，还是愿意让人多停留片刻。</p><p>Good typography gives a thought room to breathe. 同一段文字，不同的字号与行距，会有不同的阅读节奏。</p></div></article></div><footer class="scene-colophon"><span>FIELD NOTES</span><span>原创虚构场景</span></footer></section><section class="scene-inspector" aria-label="调整这个样本"><label class="range-control" for="size">正文字号<output id="size-value">17px</output><input id="size" type="range" min="14" max="24" step="1" value="17"></label><label class="range-control" for="leading">正文行高<output id="leading-value">1.85</output><input id="leading" type="range" min="1.2" max="2.4" step=".05" value="1.85"></label></section></main><script>for(const id of ['size','leading']){const input=document.getElementById(id);input.addEventListener('input',()=>{document.getElementById('sample').style[id==='size'?'fontSize':'lineHeight']=input.value+(id==='size'?'px':'');document.getElementById(id+'-value').textContent=input.value+(id==='size'?'px':'');});}
</script></body></html>
