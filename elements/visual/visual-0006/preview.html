<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARGIN / JOURNAL · 同样内容，两种编排</title><link rel="stylesheet" href="../../scenes.css?v=01000ffa17"><script src="../../scene-lifecycle.js?v=45554bc73e" defer></script><link rel="stylesheet" href="../../compact.css?v=71075f8b47"><script src="../../compact.js?v=2f8f5ff4f8" defer></script><link rel="stylesheet" href="../../../catalog/pointer.css?v=d92459312e"><script src="../../../catalog/pointer.js?v=6a5aca2cbe" defer></script><link rel="stylesheet" href="../../../catalog/site-fonts.css?v=8d6074b2b9"></head>
<body data-scene="art-direction" data-studio="visual-0006"><main><section class="designed-scene art-direction"><header class="scene-bar"><strong>MARGIN</strong><span>AN INDEPENDENT DESIGN JOURNAL</span></header><article id="sample" class="direction-story editorial"><div class="direction-words"><h1>把日常观察，<br>变成创作材料。</h1><p class="scene-deck">从一束光、一件物、<br>一种愿意停留的编排开始。</p><p>先记录你看见的关系，再尝试把它们组织成自己的视觉语言。好的风格让内容拥有性格，也让阅读有自己的顺序。</p></div><img class="" src="../../assets/ceramic-study.jpg" width="1536" height="1024" alt="原创陶器静物，为编辑式编排提供真实图像素材"><div class="direction-bottom"><span>OBJECTS / LIGHT / WORDS</span><p>少一些装饰，多一点选择。<br>让视线有地方停下，也有方向继续。</p></div></article><footer class="scene-colophon"><span>MARGIN / JOURNAL</span><span>虚构场景 · AI 影像</span></footer></section><section class="scene-inspector" aria-label="调整这个样本"><button id="style" type="button" aria-pressed="true">切换普通编排</button></section></main><script>const b=document.getElementById('style');b.addEventListener('click',()=>{const on=document.getElementById('sample').classList.toggle('editorial');b.setAttribute('aria-pressed',String(on));b.textContent=on?'切换普通编排':'切换编辑式编排';});
document.getElementById('sample').classList.remove('editorial');document.getElementById('style').click();</script></body></html>
