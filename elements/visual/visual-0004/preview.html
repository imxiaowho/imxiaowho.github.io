<!doctype html>
<html data-site-page="example" lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KINA / OBJECTS · 表面的形态</title><link rel="stylesheet" href="../../scenes.css?v=01000ffa17"><script src="../../scene-lifecycle.js?v=45554bc73e" defer></script><link rel="stylesheet" href="../../compact.css?v=71075f8b47"><script src="../../compact.js?v=2f8f5ff4f8" defer></script><link rel="stylesheet" href="../../../catalog/pointer.css?v=d92459312e"><script src="../../../catalog/pointer.js?v=6a5aca2cbe" defer></script><link rel="stylesheet" href="../../../catalog/site-fonts.css?v=8d6074b2b9">  <script src="/assets/site-paper/theme.js?v=1fef9ef7e7"></script>

</head>
<body data-scene="surface" data-studio="visual-0004"><main><section class="designed-scene surface"><header class="scene-bar"><strong>KINA</strong><span>OBJECTS FOR SLOW LIVING</span></header><div class="object-layout"><div><h1>一个弧度，<br>一种性格。</h1><p>让形态贴近材质，<br>让表面容纳光线。</p><p class="scene-meta">OLIVE LOUNGE / FICTIONAL OBJECT</p></div><div class="object-stage"><article id="sample" class="object-card"><img class="" src="../../assets/olive-chair.jpg" width="1536" height="1024" alt="原创生成的橄榄绿曲木椅与亚麻织物"><div><h2>Olive Lounge</h2><p>曲木、亚麻与恰到好处的松弛。</p><a href="#material-note">阅读材质笔记</a></div></article></div></div><p id="material-note" class="material-note">一件虚构的家具，一次对边缘、表面与投影的观察。</p><footer class="scene-colophon"><span>KINA / OBJECTS</span><span>虚构场景 · AI 影像</span></footer></section><section class="scene-inspector" aria-label="调整这个样本"><label class="range-control" for="radius">表面圆角<output id="radius-value">12px</output><input id="radius" type="range" min="0" max="32" step="1" value="12"></label><label class="range-control" for="shadow">投影距离<output id="shadow-value">8px</output><input id="shadow" type="range" min="0" max="24" step="1" value="8"></label></section></main><script>for(const id of ['radius','shadow'])document.getElementById(id).addEventListener('input',e=>{const n=Number(e.target.value),s=document.getElementById('sample');if(id==='radius')s.style.borderRadius=n+'px';else s.style.boxShadow=n?'0 '+n+'px '+n*3+'px #17382a28':'none';document.getElementById(id+'-value').textContent=n+'px';});
</script></body></html>
