<!doctype html>
<html data-site-page="example" lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOSS / RETREAT · 玻璃感与不透明后备</title><link rel="stylesheet" href="../../scenes.css?v=01000ffa17"><script src="../../scene-lifecycle.js?v=45554bc73e" defer></script><link rel="stylesheet" href="../../compact.css?v=71075f8b47"><script src="../../compact.js?v=2f8f5ff4f8" defer></script><link rel="stylesheet" href="../../../catalog/pointer.css?v=d92459312e"><script src="../../../catalog/pointer.js?v=6a5aca2cbe" defer></script><link rel="stylesheet" href="../../../catalog/site-fonts.css?v=8d6074b2b9">  <script src="/assets/site-paper/theme.js?v=1fef9ef7e7"></script>

<body data-scene="glass" data-studio="visual-0010"><main><section class="designed-scene glass"><header class="scene-bar"><strong>MOSS</strong><span>A QUIET PLACE TO LAND</span></header><section id="scene" class="retreat-scene"><img class="retreat-photo" src="../../visual/visual-0005/assets/quiet-coast.jpg" width="1536" height="1024" alt="原创虚构海岸影像，作为磨砂材质后方的真实细节"><div class="retreat-word" aria-hidden="true">STAY<br>SLOW.</div><article id="pane" class="glass-pane"><h1>留一段空白，<br>给自己。</h1><p>透过光线看见风景，<br>把重要的信息放在前面。</p><a href="#material">看看这层材质</a></article></section><p id="support" class="material-note"></p><footer class="scene-colophon"><span>MOSS / RETREAT</span><span>虚构场景 · AI 影像</span></footer></section><section class="scene-inspector" aria-label="调整这个样本"><label id="material" class="range-control" for="blur">磨砂程度<output id="radius">14px</output><input id="blur" type="range" min="0" max="32" value="14"></label><label class="check-control"><input id="opaque" type="checkbox">使用不透明后备</label></section></main><script>
'use strict';
const blur=document.getElementById('blur'),pane=document.getElementById('pane');blur.addEventListener('input',()=>{pane.style.setProperty('--blur',blur.value+'px');document.getElementById('radius').textContent=blur.value+'px';});document.getElementById('opaque').addEventListener('change',e=>document.getElementById('scene').classList.toggle('opaque',e.target.checked));document.getElementById('support').textContent=CSS.supports('backdrop-filter','blur(1px)')||CSS.supports('-webkit-backdrop-filter','blur(1px)')?'浏览器支持背景模糊；可手动查看不透明后备。':'当前浏览器不支持背景模糊，已使用不透明后备。';

</script></body></html>
