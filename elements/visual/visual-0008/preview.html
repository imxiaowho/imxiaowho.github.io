<!doctype html>
<html data-site-page="example" lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COMMON GROUND · 文字对比度实验</title><link rel="stylesheet" href="../../scenes.css?v=01000ffa17"><script src="../../scene-lifecycle.js?v=45554bc73e" defer></script><link rel="stylesheet" href="../../compact.css?v=71075f8b47"><script src="../../compact.js?v=2f8f5ff4f8" defer></script><link rel="stylesheet" href="../../../catalog/pointer.css?v=d92459312e"><script src="../../../catalog/pointer.js?v=6a5aca2cbe" defer></script><link rel="stylesheet" href="../../../catalog/site-fonts.css?v=8d6074b2b9">  <script src="/assets/site-paper/theme.js?v=1fef9ef7e7"></script>
  <link rel="stylesheet" href="/assets/site-paper/theme.css?v=1414eeb17a">
</head>
<body data-scene="contrast" data-studio="visual-0008"><main><section class="designed-scene contrast"><header class="scene-bar"><strong>COMMON GROUND</strong><span>A COLOR & LEGIBILITY STUDIO</span></header><div class="contrast-layout"><section id="sample" class="contrast-poster"><h1>先被看见，<br>再被理解。</h1><p>让文字在它的背景上，拥有足够清晰的声音。</p><span>Clarity is part of beauty.</span></section><aside><h2>颜色，也有分寸。</h2><p>选择文字和纸面的颜色，比较眼前的可读性。</p><output id="ratio" class="contrast-result" aria-live="polite"></output><p id="threshold" class="contrast-threshold"></p><p class="scene-meta">这里只计算当前两种不透明 sRGB 颜色，不能代替整页可访问性检查。</p></aside></div><footer class="scene-colophon"><span>COMMON GROUND</span><span>原创虚构场景</span></footer></section><section class="scene-inspector" aria-label="调整这个样本"><label class="color-control" for="fg">文字颜色<input id="fg" type="color" value="#2f3e2c"></label><label class="color-control" for="bg">背景颜色<input id="bg" type="color" value="#e5eadc"></label><button id="strong" type="button">黑白对照</button><button id="same" type="button">同色比较</button></section></main><script>const fg=document.getElementById('fg'),bg=document.getElementById('bg');function luminance(hex){const c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return c[0]*.2126+c[1]*.7152+c[2]*.0722;}function update(){const a=luminance(fg.value),b=luminance(bg.value),ratio=(Math.max(a,b)+.05)/(Math.min(a,b)+.05);document.getElementById('sample').style.color=fg.value;document.getElementById('sample').style.background=bg.value;document.getElementById('ratio').textContent='当前对比度 '+ratio.toFixed(3)+' : 1';document.getElementById('threshold').textContent='普通文字参考：'+(ratio>=4.5?'达到4.5:1':'不足4.5:1')+'；大字号参考：'+(ratio>=3?'达到3:1':'不足3:1');}for(const i of [fg,bg])i.addEventListener('input',update);document.getElementById('strong').addEventListener('click',()=>{fg.value='#000000';bg.value='#ffffff';update();});document.getElementById('same').addEventListener('click',()=>{fg.value=bg.value;update();});update();

</script></body></html>
