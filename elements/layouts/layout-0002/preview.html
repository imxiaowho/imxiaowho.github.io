<!doctype html>
<html data-site-page="example" lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>READING ROOM · 响应式与间距阶梯</title><link rel="stylesheet" href="../../scenes.css?v=01000ffa17"><script src="../../scene-lifecycle.js?v=45554bc73e" defer></script><link rel="stylesheet" href="../../compact.css?v=71075f8b47"><script src="../../compact.js?v=2f8f5ff4f8" defer></script><link rel="stylesheet" href="../../../catalog/pointer.css?v=d92459312e"><script src="../../../catalog/pointer.js?v=6a5aca2cbe" defer></script><link rel="stylesheet" href="../../../catalog/site-fonts.css?v=8d6074b2b9">  <script src="/assets/site-paper/theme.js?v=1fef9ef7e7"></script>
  <link rel="stylesheet" href="/assets/site-paper/theme.css?v=1414eeb17a">
</head>
<body data-scene="responsive" data-studio="layout-0002"><main><section class="designed-scene responsive"><header class="scene-bar"><strong>READING ROOM</strong><span>A SMALL INDEPENDENT LIBRARY</span></header><div class="responsive-stage"><section id="sample" class="reading-room"><header><strong>Room for thought.</strong><span>阅读 / 观察 / 收藏</span></header><div class="room-grid"><article><h1>让内容，<br>决定排列。</h1><p>书页、光线和一个能安静坐下来的角落。内容宽裕时并排，空间收紧时，自然回到阅读的顺序。</p><p>每一行文字，都该拥有被舒服读完的空间。</p><a href="#room-note">继续阅读</a></article><img class="" src="../../assets/olive-chair.jpg" width="1536" height="1024" alt="原创虚构曲木阅读椅，响应式阅读室配图"></div><p id="room-note">A room is an invitation to slow down.</p></section></div><footer class="scene-colophon"><span>READING ROOM</span><span>虚构场景 · AI 影像</span></footer></section><section class="scene-inspector" aria-label="调整这个样本"><label class="range-control" for="width">可用容器宽度<output id="width-value">900px（受页面限制）</output><input id="width" type="range" min="260" max="1100" value="900"></label><label class="range-control" for="space">间距基准<output id="space-value">8px</output><input id="space" type="range" min="4" max="16" value="8"></label></section></main><script>document.getElementById('width').addEventListener('input',e=>{document.getElementById('sample').style.width=e.target.value+'px';document.getElementById('width-value').textContent=e.target.value+'px（受页面限制）';});document.getElementById('space').addEventListener('input',e=>{document.getElementById('sample').style.setProperty('--space',e.target.value+'px');document.getElementById('space-value').textContent=e.target.value+'px';});

</script></body></html>
