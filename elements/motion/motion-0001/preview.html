<!doctype html>
<html data-site-page="example" lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交错入场 / 创作工作室</title><link rel="stylesheet" href="../motion.css?v=a25ede1e13"><link rel="stylesheet" href="../../compact.css?v=71075f8b47"><script src="../../compact.js?v=2f8f5ff4f8" defer></script><link rel="stylesheet" href="../../../catalog/pointer.css?v=d92459312e"><script src="../../../catalog/pointer.js?v=6a5aca2cbe" defer></script><link rel="stylesheet" href="../../../catalog/site-fonts.css?v=8d6074b2b9">  <script src="/assets/site-paper/theme.js?v=1fef9ef7e7"></script>

</head><body data-studio="motion-0001"><main><section class="experience projects"><header class="sitebar"><strong class="brand">forma.</strong><span>SELECTED WORK / 2026</span></header><div class="canvas-title"><h1 class="scene-heading">Ideas, made<br>tangible.</h1><p>让想法从纸面出发，<br>成为可触摸的作品。</p></div><div id="sample" class="project-grid"><article class="motion-item" style="--i:0"><div class="project-art one"><img class="scene-photo" src="../../assets/olive-chair.jpg" width="1536" height="1024" alt="原创曲木家具项目影像"></div><div class="project-caption"><strong>Ordinary Objects</strong><span>Identity</span></div></article><article class="motion-item" style="--i:1"><div class="project-art two"><img class="scene-photo" src="../../visual/visual-0005/assets/quiet-coast.jpg" width="1536" height="1024" alt="原创虚构海岸空间项目影像"></div><div class="project-caption"><strong>Between Spaces</strong><span>Editorial</span></div></article><article class="motion-item" style="--i:2"><div class="project-art three"><b>Slow<br>Sunday</b></div><div class="project-caption"><strong>Slow Sunday</strong><span>Art direction</span></div></article></div><footer class="scene-foot"><span>Independent creative study</span><span>VBC / Original interaction</span></footer></section><div class="inspector"><strong>交错入场 / 创作工作室</strong><button id="replay">重播入场</button><label>缓动<select id="easing"><option value="cubic-bezier(.16,1,.3,1)">自然减速</option><option value="linear">匀速对比</option></select></label><label>交错<select id="interval"><option value="80">80ms</option><option value="0">同时开始</option><option value="160">160ms</option></select></label></div><p id="motion-state" class="status" role="status"></p><p class="study-note">独立原创场景 · 品牌、项目与预约均为演示数据 · 本地运行，无外部提交</p></main><script>const s=document.getElementById('sample'),state=document.getElementById('motion-state'),reduced=matchMedia('(prefers-reduced-motion: reduce)');function play(){s.classList.remove('play');void s.offsetWidth;if(!reduced.matches){s.classList.add('play');state.textContent='当前示例：非循环播放，可重复触发。';}else state.textContent='系统已开启减少动态：显示静态最终状态。';}document.getElementById('replay').addEventListener('click',play);for(const id of ['easing','interval'])document.getElementById(id).addEventListener('change',e=>{s.style.setProperty('--'+id,e.target.value+(id==='interval'?'ms':''));});document.addEventListener('visibilitychange',()=>{if(document.hidden)s.classList.remove('play');});reduced.addEventListener('change',()=>{s.classList.remove('play');state.textContent=reduced.matches?'系统已开启减少动态：显示静态最终状态。':'可按重播观察运动。';});state.textContent=reduced.matches?'系统已开启减少动态：显示静态最终状态。':'可按重播观察运动。';if(window.parent!==window){const reportHeight=()=>parent.postMessage({type:'vbc-preview-height',height:Math.ceil(document.body.getBoundingClientRect().height)},'*');new ResizeObserver(reportHeight).observe(document.body);reportHeight();}
play();</script><script src="../../studio.js?v=22ead3b224"></script></body></html>
