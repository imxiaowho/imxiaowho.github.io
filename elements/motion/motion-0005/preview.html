<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>点击波纹 / 预约体验</title><link rel="stylesheet" href="../motion.css?v=a25ede1e13"><link rel="stylesheet" href="../../compact.css?v=71075f8b47"><script src="../../compact.js?v=2f8f5ff4f8" defer></script><link rel="stylesheet" href="../../../catalog/pointer.css?v=d92459312e"><script src="../../../catalog/pointer.js?v=6a5aca2cbe" defer></script><link rel="stylesheet" href="../../../catalog/site-fonts.css?v=8d6074b2b9"></head><body data-studio="motion-0005"><main><section class="experience booking"><header class="sitebar"><strong class="brand">KIN / SESSIONS</strong><span>TIME WELL SPENT</span></header><div class="booking-layout"><div><h1 class="scene-heading">留一点时间，<br>聊一个想法。</h1><p class="scene-copy">一次不被打断的创作交流。<br>从你正在思考的问题开始。</p><ol class="conversation-agenda"><li>正在做的事</li><li>想一起解决的问题</li><li>接下来的一小步</li></ol></div><section class="appointment" aria-label="演示预约"><div class="appointment-head"><strong>Studio conversation</strong><span>30 MIN / DEMO</span></div><p style="font-size:12px;margin-top:18px">选择周五的一个时间</p><div class="slots"><label class="slot"><input type="radio" name="slot" value="14:30" checked><span>14:30</span></label><label class="slot"><input type="radio" name="slot" value="16:00"><span>16:00</span></label></div><button class="ripple-button" id="activate" type="button">确认这个时间</button><p id="result" class="result" role="status">演示预约，仅在当前页面预览。</p></section></div><footer class="scene-foot"><span>Independent creative study</span><span>VBC / Original interaction</span></footer></section><div class="inspector"><strong>点击波纹 / 预约体验</strong><label><input id="static" type="checkbox">关闭波纹</label></div><p class="study-note">独立原创场景 · 品牌、项目与预约均为演示数据 · 本地运行，无外部提交</p></main><script>
'use strict';
const button=document.getElementById('activate'),staticMode=document.getElementById('static'),pref=matchMedia('(prefers-reduced-motion:reduce)');let count=0;const clear=()=>{button.getAnimations({subtree:true}).forEach(a=>a.cancel());button.querySelectorAll('.ripple').forEach(n=>n.remove());};staticMode.addEventListener('change',clear);pref.addEventListener('change',clear);document.addEventListener('visibilitychange',()=>{if(document.hidden)clear();});button.addEventListener('click',e=>{document.getElementById('result').textContent=`已选择周五 ${document.querySelector('input[name=slot]:checked').value}，30分钟交流。演示已确认 ${++count} 次，未创建真实预约。`;clear();if(staticMode.checked||pref.matches)return;const rect=button.getBoundingClientRect(),size=Math.hypot(rect.width,rect.height)*2;const dot=document.createElement('span');dot.className='ripple';dot.setAttribute('aria-hidden','true');const pointer=e.detail>0;Object.assign(dot.style,{width:size+'px',height:size+'px',left:(pointer?e.clientX-rect.left:rect.width/2)+'px',top:(pointer?e.clientY-rect.top:rect.height/2)+'px'});button.append(dot);const anim=dot.animate([{transform:'translate(-50%,-50%) scale(0)',opacity:.4},{transform:'translate(-50%,-50%) scale(1)',opacity:0}],{duration:480,easing:'cubic-bezier(.16,1,.3,1)'});anim.finished.then(()=>dot.remove(),()=>dot.remove());});
if(parent!==window){const reportHeight=()=>parent.postMessage({type:'vbc-preview-height',height:Math.ceil(document.body.getBoundingClientRect().height)},'*');new ResizeObserver(reportHeight).observe(document.body);reportHeight();}</script><script src="../../studio.js?v=22ead3b224"></script></body></html>
