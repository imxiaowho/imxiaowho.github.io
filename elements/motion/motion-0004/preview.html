<!doctype html>
<html data-site-page="example" lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文字入场 / 品牌工作室</title><link rel="stylesheet" href="../motion.css?v=a25ede1e13"><link rel="stylesheet" href="../../compact.css?v=71075f8b47"><script src="../../compact.js?v=2f8f5ff4f8" defer></script><link rel="stylesheet" href="../../../catalog/pointer.css?v=d92459312e"><script src="../../../catalog/pointer.js?v=6a5aca2cbe" defer></script><link rel="stylesheet" href="../../../catalog/site-fonts.css?v=8d6074b2b9">  <script src="/assets/site-paper/theme.js?v=1fef9ef7e7"></script>

</head><body data-studio="motion-0004"><main><section class="experience type-scene"><header class="sitebar"><strong class="brand">OTHER / STUDIO</strong><span>INDEPENDENT DESIGN PRACTICE</span></header><div class="type-hero"><h1 id="sample" aria-label="让想象，多走一步。"><span id="visual" aria-hidden="true">让想象，多走一步。</span></h1><p>品牌、数字体验与新的可能性。<br>我们为仍未发生的想法，找到一种表达。</p></div><div class="type-work"><figure><img class="scene-photo" src="../../visual/visual-0005/assets/quiet-coast.jpg" width="1536" height="1024" alt="原创虚构空间品牌视觉"><figcaption>Spaces / 看见新的可能</figcaption></figure><figure><img class="scene-photo" src="../../assets/ceramic-study.jpg" width="1536" height="1024" alt="原创静物品牌视觉"><figcaption>Objects / 给日常新的表达</figcaption></figure></div><footer class="scene-foot"><span>Independent creative study</span><span>VBC / Original interaction</span></footer></section><div class="inspector"><strong>文字入场 / 品牌工作室</strong><label>标题<input id="text" type="text" maxlength="48" value="让想象，多走一步。" style="width:185px;min-width:0"></label><label>方式<select id="mode"><option value="reveal">模糊渐显</option><option value="type">打字机</option></select></label><button id="play">重播标题</button><label><input id="static" type="checkbox">静态显示</label></div><p id="state" class="status" role="status">完整标题始终可直接显示。</p><p class="study-note">独立原创场景 · 品牌、项目与预约均为演示数据 · 本地运行，无外部提交</p></main><script>const text=document.getElementById('text'),mode=document.getElementById('mode'),visual=document.getElementById('visual'),sample=document.getElementById('sample'),staticMode=document.getElementById('static'),reduced=matchMedia('(prefers-reduced-motion: reduce)'),state=document.getElementById('state');let timer=null;function parts(){const value=text.value||'让想象，多走一步。';return typeof Intl.Segmenter==='function'?[...new Intl.Segmenter('zh',{granularity:'grapheme'}).segment(value)].map(s=>s.segment).slice(0,24):[value];}function stop(){clearTimeout(timer);timer=null;visual.classList.remove('animate');}function full(){stop();const list=parts();sample.setAttribute('aria-label',list.join(''));visual.textContent=list.join('');state.textContent=staticMode.checked||reduced.matches?'减少动态：静态完整显示。':'当前完整显示，可以重播。';}function play(){full();const list=parts();if(staticMode.checked||reduced.matches||typeof Intl.Segmenter!=='function'){state.textContent='静态完整显示；减少动态或浏览器不支持grapheme切分。';return;}state.textContent='正在播放，可再次重播或切换静态。';visual.replaceChildren();if(mode.value==='reveal'){for(const [i,char]of list.entries()){const span=document.createElement('span');span.className='char';span.style.setProperty('--i',i);span.textContent=char;visual.append(span);}void visual.offsetWidth;visual.classList.add('animate');}else{let i=0;const tick=()=>{visual.textContent=list.slice(0,++i).join('');if(i<list.length)timer=setTimeout(tick,80);else{timer=null;state.textContent='打字完成。';}};tick();}}visual.addEventListener('animationend',e=>{if(e.target===visual.lastElementChild&&mode.value==='reveal')state.textContent='字符显现完成。';});document.getElementById('play').addEventListener('click',play);for(const el of [text,mode,staticMode])el.addEventListener('input',full);reduced.addEventListener('change',full);document.addEventListener('visibilitychange',()=>{if(document.hidden)full();});
if(parent!==window){const reportHeight=()=>parent.postMessage({type:'vbc-preview-height',height:Math.ceil(document.body.getBoundingClientRect().height)},'*');new ResizeObserver(reportHeight).observe(document.body);reportHeight();}
play();</script><script src="../../studio.js?v=22ead3b224"></script></body></html>
