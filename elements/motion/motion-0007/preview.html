  .paper-live-hint { display: none; }
  .paper-static-hint { display: block; }

<body data-studio="motion-0007">
  <main class="paper-study">
    <header class="paper-mast"><strong>paper<span>/</span></strong><span>INTERACTIVE MATERIAL</span></header>
    <section class="paper-playground" aria-label="纸面点阵波纹体验">
      <header class="paper-heading">
        <div><h1>局部响应，自然回弹</h1><p class="paper-live-hint">划过点阵，观察局部起伏；移开鼠标，让纸面回到平静。</p><p class="paper-static-hint">这里展示静止的纸纹和点阵。</p></div>
        <button id="paper-motion" type="button" aria-pressed="false" hidden>底纹动效</button>
      </header>
      <div class="paper-surface" data-paper-surface>
        <canvas id="paper-field" aria-hidden="true"></canvas>
        <p class="paper-surface-hint paper-live-hint">在这里移动鼠标<span>纸纤维静止 · 点阵轻轻回弹</span></p><p class="paper-surface-hint paper-static-hint">纸纹与点阵</p>
      </div>
    </section>
    <details class="paper-spec">
      <summary>实现与静态后备</summary>
      <p>纸纤维保持静止，只有指针附近的点发生位移。使用共用的弹性点阵引擎，局部画布独立响应。停止后结束重绘；触屏、减少动态偏好及手动关闭时保留静态底纹。</p>
      <p>复用本页的纸面 CSS、catalog/paper-field.js、catalog/assets/paper-fiber.png，保留静态后备与开关。场景为独立原创，新的演示版本待逐项审阅。</p>
    </details>
  </main>
</body>
