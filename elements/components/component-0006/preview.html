<body data-scene="feedback" data-studio="component-0006"><main><section class="designed-scene feedback"><header class="scene-bar"><strong>COMMON</strong><span>YOUR PROJECT WORKSPACE</span></header><div class="scene-intro"><h1>每一次操作，<br>都应该有回音。</h1><p>短确认会离开，重要的问题会留下。</p></div><div class="workspace-layout"><section class="project-settings"><div><img class="" src="../../assets/olive-chair.jpg" width="1536" height="1024" alt="原创曲木家具影像作为项目封面"></div><article><span class="scene-meta">CURRENT PROJECT / DEMO</span><h2>Objects for everyday.</h2><p>一次关于日常物件的创作记录。</p><div class="workspace-actions"><button id="success" type="button" class="scene-action">应用演示封面</button><button id="failure" type="button">预览失败状态</button></div><p class="inline-status">所有变化仅在当前页面演示。</p></article></section><aside class="activity-log"><h2>最近一次结果</h2><p id="last" role="status">尚未执行操作。</p><div id="error" class="persistent-error" hidden><h3>这次操作没有完成。</h3><p>错误会一直保留，直到你重试成功。没有真实数据丢失。</p><button id="retry" type="button">重试本地演示</button></div><button id="dismiss" type="button" class="quiet-button">收起短提示</button></aside></div><div id="toast" aria-live="polite"></div><p id="urgent" class="sr-only" role="alert"></p><footer class="scene-colophon"><span>COMMON / WORKSPACE</span><span>虚构场景 · AI 影像</span></footer></section></main><script>
'use strict';
const toast=document.getElementById('toast'),error=document.getElementById('error'),last=document.getElementById('last'),urgent=document.getElementById('urgent');let timer,count=0;function dismiss(){clearTimeout(timer);toast.textContent='';toast.className='';}function success(){dismiss();error.hidden=true;urgent.textContent='';const text='本页演示更新完成 · '+(++count);toast.className='toast';toast.textContent=text;last.textContent=text+'（没有持久化保存）';timer=setTimeout(dismiss,4500);}document.getElementById('success').addEventListener('click',success);document.getElementById('failure').addEventListener('click',()=>{dismiss();error.hidden=false;last.textContent='本地模拟失败，等待重试。';urgent.textContent='本地模拟操作失败，请使用页面上的重试按钮。';});document.getElementById('retry').addEventListener('click',()=>{success();document.getElementById('success').focus();});document.getElementById('dismiss').addEventListener('click',dismiss);

</script></body></html>
