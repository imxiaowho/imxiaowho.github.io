<body data-scene="tabs" data-studio="component-0003"><main><section class="designed-scene tabs"><header class="scene-bar"><strong>COMMON</strong><span>LEARN BY MAKING</span></header><div class="workshop-banner"><div><h1>从一件小作品，<br>开始新的对话。</h1><p>一个关于观察、材料与表达的虚构工作坊。</p></div><img class="" src="../../assets/ceramic-study.jpg" width="1536" height="1024" alt="原创生成的陶器工作坊视觉素材"></div><div class="course-tabs" role="tablist" aria-label="工作坊信息"><button role="tab" id="course-tab-1" aria-selected="true" tabindex="0" aria-controls="course-panel-1">课程介绍</button><button role="tab" id="course-tab-2" aria-selected="false" tabindex="-1" aria-controls="course-panel-2">时间地点</button><button role="tab" id="course-tab-3" aria-selected="false" tabindex="-1" aria-controls="course-panel-3">参与方式</button></div><div class="course-bottom"><div><section role="tabpanel" id="course-panel-1" aria-labelledby="course-tab-1"><h2>让手，跟上想法。</h2><p>从生活里选一件物品，观察它的形状与关系，再用自己的方式重新表达。</p></section><section role="tabpanel" id="course-panel-2" aria-labelledby="course-tab-2" hidden><h2>一个不被打断的下午。</h2><p>演示时间：周六 14:00—17:00。虚构的 COMMON 创作空间，不接受真实到场。</p></section><section role="tabpanel" id="course-panel-3" aria-labelledby="course-tab-3" hidden><h2>带着好奇心就好。</h2><p>点击右侧入口查看演示参与说明。本页不会建立真实预约或发送消息。</p></section></div><button id="open" type="button" class="scene-action">查看参与说明</button></div><dialog id="dialog"><form method="dialog"><h2>给创作，一个下午。</h2><p>这是原生对话框演示：焦点留在对话中，按 Escape 或下方按钮返回。没有提交真实报名。</p><button autofocus value="close">记下了，返回页面</button></form></dialog><footer class="scene-colophon"><span>COMMON / WORKSHOPS</span><span>虚构场景 · AI 影像</span></footer></section></main><script>const tabs=[...document.querySelectorAll('[role=tab]')];function activate(index,focus){tabs.forEach((tab,i)=>{const active=i===index;tab.setAttribute('aria-selected',String(active));tab.tabIndex=active?0:-1;document.getElementById(tab.getAttribute('aria-controls')).hidden=!active;});if(focus)tabs[index].focus();}tabs.forEach((tab,i)=>{tab.addEventListener('click',()=>activate(i,false));tab.addEventListener('keydown',e=>{let next=null;if(e.key==='ArrowRight')next=(i+1)%tabs.length;if(e.key==='ArrowLeft')next=(i-1+tabs.length)%tabs.length;if(e.key==='Home')next=0;if(e.key==='End')next=tabs.length-1;if(next!==null){e.preventDefault();activate(next,true);}});});const trigger=document.getElementById('open'),dialog=document.getElementById('dialog');trigger.addEventListener('click',()=>dialog.showModal());dialog.addEventListener('close',()=>trigger.focus());

</script></body></html>
