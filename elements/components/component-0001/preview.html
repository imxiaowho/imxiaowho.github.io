<body data-scene="cards" data-studio="component-0001"><main><section class="designed-scene cards"><header class="scene-bar"><strong>FOUND</strong><span>A PERSONAL READING LIST</span></header><div class="scene-intro"><h1>把想再读一遍的，<br>留在这里。</h1><p>一本关于物件、创作与慢生活的虚构阅读清单。</p></div><div class="reading-list-layout"><article class="feature-card"><img class="" src="../../assets/ceramic-study.jpg" width="1536" height="1024" alt="原创生成的陶器静物，为阅读卡片提供内容配图"><div><span class="scene-meta">OBJECTS / 6 MIN READ</span><h2>日常里的小仪式</h2><p>一只器皿、一束枝叶，和给生活留一点空白的理由。</p><button id="save" type="button" aria-pressed="false">收藏这篇文章</button><p id="feedback" role="status">尚未收藏 · 当前页面演示</p></div></article><aside class="reading-notes"><h2>本周想读</h2><details open><summary>让空间，拥有自己的声音。</summary><p>一种材料、一束光线，会改变我们与空间相处的方式。</p></details><details><summary>一张椅子，可以慢慢选。</summary><p>从轮廓到触感，让物件回到每天使用它的人身边。</p></details><details><summary>给新的想法留一页。</summary><p>把看见的、想过的，写成下一次创作的起点。</p></details></aside></div><footer class="scene-colophon"><span>FOUND / READING LIST</span><span>虚构场景 · AI 影像</span></footer></section></main><script>document.getElementById('save').addEventListener('click',e=>{const b=e.currentTarget,on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));b.textContent=on?'取消收藏':'收藏这篇文章';document.getElementById('feedback').textContent=on?'已收藏 · 刷新后不会保存':'尚未收藏 · 状态仅用于当前页面';});
