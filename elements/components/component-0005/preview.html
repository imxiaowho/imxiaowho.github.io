<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INLET / EDITOR · 把表单选择说清楚</title><link rel="stylesheet" href="../../scenes.css?v=01000ffa17"><script src="../../scene-lifecycle.js?v=45554bc73e" defer></script><link rel="stylesheet" href="../../compact.css?v=71075f8b47"><script src="../../compact.js?v=2f8f5ff4f8" defer></script><link rel="stylesheet" href="../../../catalog/pointer.css?v=d92459312e"><script src="../../../catalog/pointer.js?v=6a5aca2cbe" defer></script><link rel="stylesheet" href="../../../catalog/site-fonts.css?v=8d6074b2b9"></head>
<body data-scene="form" data-studio="component-0005"><main><section class="designed-scene form"><header class="scene-bar"><strong>INLET</strong><span>A LITTLE EDITORIAL DESK</span></header><div class="scene-intro"><h1>写下想法，<br>看见它的样子。</h1><p>选择如何呈现。每一次调整，都有眼前的回应。</p></div><div class="editor-layout"><form id="form" class="editor-form"><label for="title">作品标题</label><input id="title" type="text" maxlength="60" value="把日常，收进一册。" aria-describedby="title-help"><p id="title-help">最多60字，仅改变当前预览。</p><fieldset><legend>布局方式</legend><label><input type="radio" name="layout" value="card" checked>封面卡片</label><label><input type="radio" name="layout" value="list">紧凑列表</label></fieldset><fieldset><legend>显示内容</legend><label><input id="summary-choice" type="checkbox" checked>作品摘要</label><label><input id="date-choice" type="checkbox" checked>日期</label></fieldset><label class="switch-row" for="compact">紧凑间距<input id="compact" type="checkbox" role="switch"></label></form><div class="editor-preview-ground"><article id="preview" class="editor-preview"><img class="" src="../../assets/ceramic-study.jpg" width="1536" height="1024" alt="原创陶器静物作为编辑预览封面"><div><span class="scene-meta">A FIELD NOTE / DESIGN & EVERYDAY</span><h2 id="preview-title">把日常，收进一册。</h2><p id="summary">在一件物品和一束光里，找到下一次创作的线索。</p><p id="date" class="scene-meta">2026.11 / 演示刊期</p></div></article><p id="state" role="status">卡片布局 · 标准间距</p></div></div><footer class="scene-colophon"><span>INLET / EDITOR</span><span>虚构场景 · AI 影像</span></footer></section></main><script>
'use strict';
const form=document.getElementById('form'),preview=document.getElementById('preview');form.addEventListener('submit',e=>e.preventDefault());function update(){const compact=document.getElementById('compact').checked,list=form.elements.layout.value==='list';document.getElementById('preview-title').textContent=document.getElementById('title').value||'未命名预览';document.getElementById('summary').hidden=!document.getElementById('summary-choice').checked;document.getElementById('date').hidden=!document.getElementById('date-choice').checked;preview.classList.toggle('compact',compact);preview.classList.toggle('list',list);document.getElementById('state').textContent=(list?'列表':'卡片')+'布局 · '+(compact?'紧凑间距':'标准间距');}form.addEventListener('input',update);

update();</script></body></html>
