<body data-scene="loading" data-studio="component-0004"><main><section class="designed-scene loading"><header class="scene-bar"><strong>STUDIO INDEX</strong><span>DESIGN / OBJECTS / EVERYDAY</span></header><div class="scene-intro"><h1>发现一些，<br>值得停留的设计。</h1><p>用清楚的状态，让等待和结果都有交代。</p></div><section id="viewport" class="collection-viewport" aria-busy="false"><div id="loading" hidden class="skeleton-grid" aria-hidden="true"><div class="skeleton-card"><i></i><b></b><span></span></div><div class="skeleton-card"><i></i><b></b><span></span></div><div class="skeleton-card"><i></i><b></b><span></span></div></div><div id="success" class="loaded-grid"><article class="object-tile"><img loading="lazy" src="../../assets/olive-chair.jpg" width="1536" height="1024" alt="Olive Lounge，原创生成影像"><h2>Olive Lounge</h2><p>OBJECT / 曲木与亚麻</p></article><article class="object-tile"><img loading="lazy" src="../../assets/ceramic-study.jpg" width="1536" height="1024" alt="Quiet Vessels，原创生成影像"><h2>Quiet Vessels</h2><p>CRAFT / 陶与枝叶</p></article><article class="object-tile"><img loading="lazy" src="../../visual/visual-0005/assets/quiet-coast.jpg" width="1536" height="1024" alt="A Place to Pause，原创生成影像"><h2>A Place to Pause</h2><p>SPACE / 海岸与留白</p></article></div><div id="empty" hidden class="result-empty"><h2>没有匹配的作品</h2><p>加载已完成，当前没有匹配的作品。</p><button id="show-content" type="button">查看全部作品</button></div><div id="error" hidden class="result-error"><h2>暂时没有把作品带过来。</h2><p>这是本地模拟失败，你可以重试。</p><button id="retry" type="button">重新加载</button></div></section><button id="finish-skeleton" type="button" hidden>完成加载</button><p id="status" class="inline-status" role="status">当前展示本地收藏内容。</p><footer class="scene-colophon"><span>STUDIO INDEX</span><span>虚构场景 · AI 影像</span></footer></section><section class="scene-inspector" aria-label="调整这个样本"><label for="outcome">下一次加载的结果<select id="outcome"><option value="success">有内容</option><option value="empty">空结果</option><option value="error">加载失败</option></select></label><button id="load" type="button">开始模拟加载</button><label class="check-control"><input id="static" type="checkbox">静态占位</label></section></main><script>
'use strict';
const viewport=document.getElementById('viewport'),load=document.getElementById('load'),select=document.getElementById('outcome');let timer;const ids=['loading','success','empty','error'];function render(state){ids.forEach(id=>document.getElementById(id).hidden=id!==state);viewport.setAttribute('aria-busy',String(state==='loading'));load.textContent=state==='loading'?'重新开始加载':'开始模拟加载';document.getElementById('status').textContent={loading:'正在模拟加载，占位不代表完成百分比。',success:'本地示例加载完成。',empty:'已完成加载，结果为空。',error:'模拟加载失败，可重试。'}[state];}const finishSkeleton = document.getElementById('finish-skeleton');
const requested = new URLSearchParams(location.search).get('state');
if (requested === 'empty') {
  select.value = 'empty';
  render('empty');
} else if (requested === 'skeleton') {
  render('loading');
  finishSkeleton.hidden = false;
}
finishSkeleton.addEventListener('click', () => {
  finishSkeleton.hidden = true;
  render(select.value);
  load.focus();
});
function start(){
  finishSkeleton.hidden = true;
  clearTimeout(timer);const outcome=select.value;render('loading');timer=setTimeout(()=>render(outcome),1400);}load.addEventListener('click',start);function recover(){select.value='success';start();load.focus();}document.getElementById('retry').addEventListener('click',recover);document.getElementById('show-content').addEventListener('click',recover);document.getElementById('static').addEventListener('change',e=>viewport.classList.toggle('static',e.target.checked));

</script></body></html>
