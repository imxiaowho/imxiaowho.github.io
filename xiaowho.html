          <h1 id="character-title"><span data-en="Xiaowho’s character portrait">小谁的角色定妆</span></h1>
          <p><span data-en="Xiaowho lives in the margins of Chen Zhen’s drafts. When a question comes up, it leans in to take a look. If it finds a useful little tool, it tries it out and makes a note.">小谁住在陈震的草稿边上。碰到没想明白的事，它就凑过去看。试过一个好用的小工具，也会在本子上记一笔。</span></p>

            data-light-en="Full light-background portrait of Xiaowho, a hooked charcoal ink drop with ivory eyes, a mustard pouch, and short arms and feet." data-dark-en="Full dark-background portrait of Xiaowho, a hooked ivory ink drop with charcoal eyes, a mustard pouch, and short arms and feet.">

          <h2 id="silhouette"><span data-en="The shape of an ink drop">墨点的样子</span></h2>
          <p><span data-en="A round body, a curled tip, short arms and little feet. Xiaowho has no mouth and speaks with its eyes, brows and gestures. It is charcoal on light paper and warm ivory on dark paper, with the same mustard pouch.">胖胖的身体、圆弯钩和短手短脚。小谁没有嘴，靠眉眼和动作表达心情。浅底是墨灰，深底换成暖米白，黄挎包一直在。</span></p>
        </section>

          <h2 id="pouch"><span data-en="Drafts in the yellow pouch">黄挎包里的草稿</span></h2>
          <p><span data-en="The pouch is full of tools and unfinished drafts. When Xiaowho finishes something, it folds the note twice, tucks it inside and gives the pouch a little pat.">包里塞着小工具和没写完的草稿。做完一件事，它会把纸条折两下，塞进包里，轻轻拍一下。</span></p>
